<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pasaporte Inglés — App de estudio</title>
<style>
:root{
  --navy:#17213d;--navy2:#212749;--cream:#f7f1e6;--paper:#fffaf0;--muted:#8a8f9f;--turq:#59d8d2;--gold:#d8b56d;--danger:#d96b6b;--ok:#73c994;--card:#ffffff;--line:#e7dfd1;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(135deg,var(--navy),#101827);color:#17213d;min-height:100vh} button,input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:rgba(255,250,240,.96);border-right:1px solid rgba(255,255,255,.25);padding:24px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.logo{width:48px;height:48px;border-radius:16px;background:var(--navy2);color:var(--turq);display:grid;place-items:center;font-size:25px;box-shadow:0 10px 30px rgba(0,0,0,.22)}h1{font-size:22px;margin:0;line-height:1.05;color:var(--navy2)}.sub{font-size:12px;color:#6f7484;margin-top:4px}.nav button{width:100%;border:0;background:transparent;color:#26304f;text-align:left;padding:12px 14px;border-radius:14px;margin:4px 0;cursor:pointer;display:flex;align-items:center;gap:10px}.nav button.active,.nav button:hover{background:#ece4d7}.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:18px}.metric small{color:#777}.bar{height:9px;background:#ece4d7;border-radius:99px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--turq),var(--gold));width:0}.main{padding:32px;overflow:auto}.panel{background:rgba(255,250,240,.98);border:1px solid rgba(255,255,255,.3);border-radius:28px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.22);max-width:1180px;margin:0 auto 24px}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.title{font-size:32px;color:var(--navy2);margin:0}.pill{display:inline-flex;gap:8px;align-items:center;background:#eef7f6;color:#1b5553;border:1px solid #c8ece9;padding:8px 12px;border-radius:999px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 24px rgba(23,33,61,.07)}.card h3{margin:0 0 8px;color:var(--navy2);font-size:18px}.card p{color:#5b6070;line-height:1.45}.country{cursor:pointer;transition:.2s}.country:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(23,33,61,.14)}.stamp{font-size:32px}.progressText{font-size:13px;color:#717684}.btn{border:0;background:var(--navy2);color:#fff;border-radius:14px;padding:12px 16px;cursor:pointer}.btn.secondary{background:#ece4d7;color:#26304f}.btn.ghost{background:transparent;color:var(--navy2);border:1px solid var(--line)}.btn.ok{background:#267456}.btn.danger{background:#8b3d3d}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.lessonBox{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:18px}.question{font-size:24px;color:var(--navy2);margin:8px 0 18px}.option{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:14px 16px;border-radius:14px;margin:8px 0;cursor:pointer}.option:hover{border-color:var(--turq)}.option.correct{background:#eaf8ef;border-color:#9fd9b6}.option.wrong{background:#fff0f0;border-color:#e6a0a0}.feedback{padding:14px 16px;border-radius:14px;margin-top:14px;background:#eef7f6;border:1px solid #c8ece9;color:#1b5553}.feedback.bad{background:#fff4ec;border-color:#f2cfaa;color:#7a4b1e}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.small{font-size:13px;color:#777}.kbd{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 8px;margin:2px}.textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;color:#17213d}.word{display:inline-block;padding:9px 12px;margin:5px;border-radius:12px;background:#f1ecdf;cursor:pointer}.word.used{opacity:.35}.answerTray{min-height:54px;padding:10px;border-radius:14px;background:#fff;border:1px dashed #c9bdac;margin:10px 0}.seal{display:inline-grid;place-items:center;min-width:84px;min-height:84px;border:2px dashed var(--gold);border-radius:50%;color:var(--navy2);background:#fff8e6;text-align:center;font-size:12px;font-weight:700;transform:rotate(-6deg);margin:8px}.route{padding:14px;border-left:4px solid var(--turq);background:#fff;border-radius:14px;margin:10px 0}.route.rescue{border-left-color:var(--danger);background:#fff6f2}.route.fast{border-left-color:var(--ok);background:#f0fff4}.footerNote{color:#dfe8ff;text-align:center;font-size:12px;padding:20px}@media(max-width:880px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.grid,.two{grid-template-columns:1fr}.main{padding:16px}.title{font-size:26px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">✈</div><div><h1>Pasaporte Inglés</h1><div class="sub">Estudio adaptativo para examen</div></div></div>
    <div class="nav">
      <button class="active" data-view="dashboard">🏠 Dashboard</button>
      <button data-view="map">🌍 Mapa de unidades</button>
      <button data-view="exam">📝 Modo examen</button>
      <button data-view="review">🧠 Revisión diaria</button>
      <button data-view="speaking">🎤 Speaking</button>
      <button data-view="progress">🛂 Progreso</button>
    </div>
    <div class="metric"><small>Progreso total</small><div class="bar"><span id="globalBar"></span></div><strong id="globalPct">0%</strong></div>
    <div class="metric"><small>Racha</small><h2 id="streak">0 días</h2><button class="btn secondary" onclick="dailyCheck()">Marcar estudio de hoy</button></div>
    <div class="metric"><small>Estado</small><p id="moodText">Ruta tranquila. 10 minutos bastan.</p></div>
  </aside>
  <main class="main">
    <section id="dashboard" class="panel view"></section>
    <section id="map" class="panel view hidden"></section>
    <section id="country" class="panel view hidden"></section>
    <section id="exam" class="panel view hidden"></section>
    <section id="review" class="panel view hidden"></section>
    <section id="speaking" class="panel view hidden"></section>
    <section id="progress" class="panel view hidden"></section>
    <div class="footerNote">Archivo listo para publicar como web estática: Netlify, Vercel, GitHub Pages o cualquier hosting.</div>
  </main>
</div>
<script>
const countries=[
 {id:'u1',flag:'🇨🇦',country:'Canada',unit:'Communication for Social Workers',theme:'Tipos de trabajo social, hobbies, countable/uncountable y present tenses',stamp:'FIRST SOCIAL CONVERSATION',grammar:'Present simple, present continuous, present perfect simple/continuous'},
 {id:'u2',flag:'🇺🇸',country:'USA',unit:'Migration',theme:'Immigration social work, gerunds/infinitives y past tenses',stamp:'MIGRATION ROUTE',grammar:'Gerunds, infinitives, past simple/continuous/perfect'},
 {id:'u3',flag:'🇸🇪',country:'Sweden',unit:'Gender Equality',theme:'Gender equality, prefixes/suffixes, do/make y modal verbs',stamp:'EQUALITY CHECKPOINT',grammar:'Simple modal verbs'},
 {id:'u4',flag:'🇯🇵',country:'Japan',unit:'Aging',theme:'Aging, phrasal verbs y future tenses',stamp:'FUTURE FLIGHT',grammar:'Will, be going to, present continuous future'},
 {id:'u5',flag:'🇮🇸',country:'Iceland',unit:'Mental Health',theme:'Mental health, comparatives/superlatives y relative clauses',stamp:'MENTAL HEALTH PASS',grammar:'Comparatives, superlatives, relative clauses'},
 {id:'u6',flag:'🇦🇺',country:'Australia',unit:'Health Care',theme:'Health care, compound/collective nouns y conditionals',stamp:'HEALTH CARE VISA',grammar:'Conditional sentences'}
];
const questionBank=[
 {u:'u1',type:'vocab',q:'Social workers can be found...',opts:['Only in hospitals','In every facet of community life','Only in schools'],a:1,ex:'El manual indica que pueden trabajar en escuelas, hospitales, prisiones, centros de salud mental y otros ámbitos.'},
 {u:'u1',type:'vocab',q:'Child welfare social work focuses on...',opts:['Protecting children from harm','Organising company staff','Planning diets'],a:0,ex:'Child welfare se relaciona con protección de menores y familias vulnerables.'},
 {u:'u1',type:'grammar',q:'Complete: She ___ Spanish every day.',opts:['speak','speaks','is speak'],a:1,ex:'Present simple con she/he/it añade -s.'},
 {u:'u1',type:'grammar',q:'Complete: I ___ learning English right now.',opts:['am','have','do'],a:0,ex:'Present continuous: am/is/are + verb -ing.'},
 {u:'u1',type:'grammar',q:'Which noun is uncountable?',opts:['book','advice','student'],a:1,ex:'Advice es incontable en inglés.'},
 {u:'u1',type:'speaking',q:'Say in English: Me gusta ayudar a la gente.',opts:['I like helping people','I like help people','I helping people'],a:0,ex:'Después de like suele usarse -ing: helping.'},
 {u:'u2',type:'vocab',q:'Immigration social workers help immigrants...',opts:['make the transition to their new homes','avoid all exams','become doctors'],a:0,ex:'La unidad 2 trabaja el apoyo a inmigrantes en su transición.'},
 {u:'u2',type:'grammar',q:'Complete: I enjoy ___ books.',opts:['read','reading','to reading'],a:1,ex:'Enjoy va seguido de gerundio.'},
 {u:'u2',type:'grammar',q:'Complete: She wants ___ English.',opts:['learn','learning','to learn'],a:2,ex:'Want va seguido de to + infinitive.'},
 {u:'u2',type:'grammar',q:'Complete: Yesterday, I ___ to class.',opts:['go','went','gone'],a:1,ex:'Past simple de go: went.'},
 {u:'u3',type:'vocab',q:'Gender equality means...',opts:['Equal rights and opportunities','Only helping men','Only helping children'],a:0,ex:'La igualdad de género trata derechos y oportunidades.'},
 {u:'u3',type:'grammar',q:'Choose the correct modal: You ___ respect other people.',opts:['must','to must','musts'],a:0,ex:'Los modales no llevan to ni -s.'},
 {u:'u3',type:'grammar',q:'Choose: She ___ make a decision today.',opts:['can','cans','can to'],a:0,ex:'Can + verbo base.'},
 {u:'u4',type:'vocab',q:'Aging social work helps older adults live...',opts:['independently and with dignity','only in hospitals','without family'],a:0,ex:'Aging social work se centra en autonomía, dignidad y calidad de vida.'},
 {u:'u4',type:'grammar',q:'Complete: I think it ___ rain tomorrow.',opts:['will','is','has'],a:0,ex:'Will se usa para predicciones.'},
 {u:'u4',type:'grammar',q:'Complete: She is ___ to visit her grandmother.',opts:['go','going','gone'],a:1,ex:'Be going to + verb.'},
 {u:'u5',type:'vocab',q:'Mental health social workers provide...',opts:['mental health services','car repairs','travel bookings'],a:0,ex:'La unidad 5 se centra en salud mental y atención psicosocial.'},
 {u:'u5',type:'grammar',q:'Complete: This exercise is ___ than the first one.',opts:['easy','easier','easiest'],a:1,ex:'Comparative: easier than.'},
 {u:'u5',type:'grammar',q:'Choose: The woman ___ works here is a social worker.',opts:['which','who','where'],a:1,ex:'Who se usa para personas en relative clauses.'},
 {u:'u6',type:'vocab',q:'Health care social workers help people with...',opts:['health and wellness issues','car insurance','restaurant menus'],a:0,ex:'La unidad 6 trabaja el ámbito sanitario y de salud.'},
 {u:'u6',type:'grammar',q:'Complete: If I study, I ___ pass.',opts:['will','would','was'],a:0,ex:'First conditional: if + present, will + verb.'},
 {u:'u6',type:'grammar',q:'Choose the compound noun.',opts:['health care','quickly','beautiful'],a:0,ex:'Health care funciona como compound noun.'}
];
const lessons={
 u1:['Social workers help people in many places: schools, hospitals, clinics, prisons and communities.','Likes/dislikes: I like..., I love..., I enjoy..., I can’t stand...','Countable: one book/two books. Uncountable: advice, money, water, information.','Present simple: habits. Present continuous: now. Present perfect: experience/result now.'],
 u2:['Migration: people move because of war, poverty, violence or lack of opportunities.','Immigration social workers help newcomers with housing, health, education and employment.','Gerund: enjoy reading, avoid smoking. Infinitive: want to learn, decide to study.','Past tenses: used to tell stories and past situations.'],
 u3:['Gender equality: equal rights, opportunities and respect.','Do/make: do homework, make a decision.','Modal verbs: can, must, should, may. They use the base verb.'],
 u4:['Aging social work helps older adults live independently and with dignity.','Phrasal verbs: verb + preposition. Example: look after.','Future: will, be going to, present continuous for arrangements.'],
 u5:['Mental health: emotional, psychological and social wellbeing.','Comparatives: easier, more difficult. Superlatives: easiest, most difficult.','Relative clauses: who for people, which for things.'],
 u6:['Health care social workers help people deal with health and wellness issues.','Compound nouns: health care, social worker, mental health.','Conditionals: If I study, I will pass.']
};
const speakingPrompts=[
 'Say: My name is Ana and I am studying English.',
 'Say: I like helping people.',
 'Say: I enjoy reading and watching films.',
 'Say: I have studied English today.',
 'Say: If I study every day, I will pass the exam.',
 'Speak for 30 seconds: your hobbies and interests.'
];
let state=JSON.parse(localStorage.getItem('passportEnglishState')||'{}');
state.progress=state.progress||{};state.errors=state.errors||{};state.xp=state.xp||0;state.streak=state.streak||0;state.lastStudy=state.lastStudy||'';state.answers=state.answers||[];state.speaking=state.speaking||[];
function save(){localStorage.setItem('passportEnglishState',JSON.stringify(state));renderMetrics()}
function pctUnit(id){let qs=questionBank.filter(q=>q.u===id).length;let ok=state.answers.filter(x=>x.u===id&&x.ok).length;return Math.min(100,Math.round((ok/Math.max(qs,1))*100))}
function renderMetrics(){let p=Math.round(countries.reduce((s,c)=>s+pctUnit(c.id),0)/countries.length);document.getElementById('globalBar').style.width=p+'%';document.getElementById('globalPct').textContent=p+'%';document.getElementById('streak').textContent=state.streak+' días';}
function show(view){document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));document.getElementById(view).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view)); if(view==='dashboard')renderDashboard(); if(view==='map')renderMap(); if(view==='exam')renderExamStart(); if(view==='review')renderReview(); if(view==='speaking')renderSpeaking(); if(view==='progress')renderProgress();}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));
function renderDashboard(){document.getElementById('dashboard').innerHTML=`<div class="topline"><div><h2 class="title">Dashboard de estudio</h2><p class="sub">Objetivo: aprobar el examen con sesiones cortas, revisión inteligente y rutas de rescate.</p></div><span class="pill">🧠 ${state.xp} XP</span></div><div class="grid"><div class="card"><h3>Próxima misión</h3><p>Haz 5 preguntas del país con menor progreso.</p><button class="btn" onclick="openWeakest()">Empezar ahora</button></div><div class="card"><h3>Revisión diaria</h3><p>Repasa errores frecuentes en menos de 10 minutos.</p><button class="btn secondary" onclick="show('review')">Revisar</button></div><div class="card"><h3>Simulación</h3><p>Modo examen con preguntas del manual.</p><button class="btn secondary" onclick="show('exam')">Ir al examen</button></div></div><div class="lessonBox"><h3>Mapa rápido</h3><div class="grid">${countries.map(c=>countryCard(c)).join('')}</div></div>`}
function countryCard(c){return `<div class="card country" onclick="openCountry('${c.id}')"><div class="stamp">${c.flag}</div><h3>${c.country}</h3><p><strong>${c.unit}</strong></p><p class="small">${c.theme}</p><div class="bar"><span style="width:${pctUnit(c.id)}%"></span></div><div class="progressText">${pctUnit(c.id)}% completado</div></div>`}
function renderMap(){document.getElementById('map').innerHTML=`<div class="topline"><h2 class="title">Mapa interactivo</h2><span class="pill">✈️ Países = unidades</span></div><p>Entra en cada país, estudia teoría breve, responde micro retos y desbloquea el sello.</p><div class="grid">${countries.map(c=>countryCard(c)).join('')}</div>`}
function openWeakest(){let c=[...countries].sort((a,b)=>pctUnit(a.id)-pctUnit(b.id))[0];openCountry(c.id)}
function openCountry(id){let c=countries.find(x=>x.id===id);document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));document.getElementById('country').classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let qs=questionBank.filter(q=>q.u===id);document.getElementById('country').innerHTML=`<div class="topline"><div><h2 class="title">${c.flag} ${c.country}</h2><p class="sub">${c.unit}</p></div><span class="pill">🛂 ${c.stamp}</span></div><div class="two"><div class="lessonBox"><h3>Theory Rescue</h3>${lessons[id].map(l=>`<p>• ${l}</p>`).join('')}<div class="row"><button class="btn" onclick="startQuiz('${id}')">Micro reto</button><button class="btn secondary" onclick="startRescue('${id}')">Ruta Rescue</button></div></div><div class="lessonBox"><h3>Estado del país</h3><div class="bar"><span style="width:${pctUnit(id)}%"></span></div><p><strong>${pctUnit(id)}%</strong> completado</p><p class="small">Gramática: ${c.grammar}</p><div class="seal">${pctUnit(id)>=80?'SELLO\nCONCEDIDO':'SELLO\nPENDIENTE'}</div></div></div><div id="countryWork"></div>`;}
let currentQuiz=[];let idx=0;let currentUnit='';
function startQuiz(id){currentUnit=id;currentQuiz=shuffle(questionBank.filter(q=>q.u===id)).slice(0,5);idx=0;renderQuestion()}
function startRescue(id){let weak=Object.entries(state.errors).sort((a,b)=>b[1]-a[1])[0]?.[0]||'grammar';document.getElementById('countryWork').innerHTML=`<div class="route rescue"><h3>🔴 Ruta Rescue activada</h3><p>Vamos suave. Primero una explicación corta, luego 3 preguntas fáciles.</p><p><strong>Punto débil detectado:</strong> ${weak}</p><p>Regla simple: lee, repite en voz baja y responde sin prisa.</p><button class="btn" onclick="startQuiz('${id}')">Empezar rescate</button></div>`}
function renderQuestion(){let q=currentQuiz[idx]; if(!q){document.getElementById('countryWork').innerHTML=`<div class="feedback"><h3>Checkpoint terminado</h3><p>Has sumado XP y actualizado la ruta.</p><button class="btn" onclick="openCountry('${currentUnit}')">Volver al país</button></div>`;save();return}document.getElementById('countryWork').innerHTML=`<div class="lessonBox"><div class="small">Pregunta ${idx+1}/${currentQuiz.length} · ${q.type}</div><div class="question">${q.q}</div>${q.opts.map((o,i)=>`<button class="option" onclick="answer(${i})">${o}</button>`).join('')}<div id="fb"></div></div>`}
function answer(i){let q=currentQuiz[idx];let ok=i===q.a;state.answers.push({u:q.u,type:q.type,ok,date:new Date().toISOString()}); if(ok){state.xp+=10}else{state.errors[q.type]=(state.errors[q.type]||0)+1}document.querySelectorAll('.option')[i].classList.add(ok?'correct':'wrong');document.querySelectorAll('.option')[q.a].classList.add('correct');document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'Bien.':'Casi.'}</strong> ${q.ex}<br><br>${!ok?'La app te mandará esta idea a revisión diaria.':''}</div><br><button class="btn" onclick="idx++;renderQuestion()">Continuar</button>`;save()}
function renderExamStart(){document.getElementById('exam').innerHTML=`<div class="topline"><h2 class="title">Modo examen</h2><span class="pill">⏱ Simulación práctica</span></div><p>Preguntas mezcladas: vocabulario, gramática, verdadero/falso y frases tipo examen.</p><div class="row"><button class="btn" onclick="startExam(10)">Examen corto · 10 preguntas</button><button class="btn secondary" onclick="startExam(20)">Examen completo · 20 preguntas</button></div><div id="examWork"></div>`}
function startExam(n){currentUnit='exam';currentQuiz=shuffle(questionBank).slice(0,n);idx=0;renderExamQuestion(0,0)}
function renderExamQuestion(score){let q=currentQuiz[idx]; if(!q){let pct=Math.round(score/currentQuiz.length*100);document.getElementById('examWork').innerHTML=`<div class="lessonBox"><h3>Resultado: ${pct}%</h3><p>${pct>=70?'Muy bien. Estás en zona de aprobado.':'Toca reforzar con Ruta Rescue antes de repetir.'}</p><button class="btn" onclick="renderReview()">Ver revisión</button></div>`;return}document.getElementById('examWork').innerHTML=`<div class="lessonBox"><div class="small">Examen · ${idx+1}/${currentQuiz.length}</div><div class="question">${q.q}</div>${q.opts.map((o,i)=>`<button class="option" onclick="examAns(${i},${score})">${o}</button>`).join('')}</div>`}
function examAns(i,score){let q=currentQuiz[idx];let ok=i===q.a;state.answers.push({u:q.u,type:q.type,ok,date:new Date().toISOString()}); if(ok){score++;state.xp+=15}else{state.errors[q.type]=(state.errors[q.type]||0)+1}idx++;save();renderExamQuestion(score)}
function renderReview(){let weak=Object.keys(state.errors).length?Object.entries(state.errors).sort((a,b)=>b[1]-a[1]):[['grammar',0],['vocab',0],['speaking',0]];document.getElementById('review').innerHTML=`<div class="topline"><h2 class="title">Revisión diaria</h2><span class="pill">🧠 5 minutos</span></div><p>La app prioriza lo que más falla. Sin castigo, solo repetición inteligente.</p>${weak.map(w=>`<div class="route ${w[1]>0?'rescue':'fast'}"><strong>${w[0]}</strong><p>Errores detectados: ${w[1]}</p><button class="btn secondary" onclick="quickPractice('${w[0]}')">Practicar</button></div>`).join('')}<div id="reviewWork"></div>`}
function quickPractice(type){currentQuiz=shuffle(questionBank.filter(q=>q.type===type)); if(currentQuiz.length<1) currentQuiz=shuffle(questionBank); currentQuiz=currentQuiz.slice(0,5);idx=0;currentUnit='review';document.getElementById('reviewWork').innerHTML='<div class="lessonBox" id="countryWork"></div>';renderReviewQuestion()}
function renderReviewQuestion(){let q=currentQuiz[idx]; if(!q){document.getElementById('reviewWork').innerHTML=`<div class="feedback">Revisión completada. Buen trabajo.</div>`;return}document.getElementById('reviewWork').innerHTML=`<div class="lessonBox"><div class="question">${q.q}</div>${q.opts.map((o,i)=>`<button class="option" onclick="reviewAns(${i})">${o}</button>`).join('')}</div>`}
function reviewAns(i){let q=currentQuiz[idx];let ok=i===q.a;state.answers.push({u:q.u,type:q.type,ok,date:new Date().toISOString()}); if(ok)state.xp+=8; else state.errors[q.type]=(state.errors[q.type]||0)+1;idx++;save();renderReviewQuestion()}
function renderSpeaking(){let p=speakingPrompts[Math.floor(Math.random()*speakingPrompts.length)];document.getElementById('speaking').innerHTML=`<div class="topline"><h2 class="title">Speaking Mode</h2><span class="pill">🎤 sin presión</span></div><div class="two"><div class="lessonBox"><h3>Reto de hoy</h3><p class="question">${p}</p><p class="small">Graba tu voz. Lo importante es decirlo, no hacerlo perfecto.</p><div class="row"><button class="btn" onclick="startRecording()">Grabar</button><button class="btn secondary" onclick="stopRecording()">Parar</button></div><audio id="audio" controls class="hidden" style="width:100%;margin-top:16px"></audio><div id="recStatus" class="feedback hidden"></div></div><div class="lessonBox"><h3>Escalera speaking</h3><p>1 palabra → 1 frase → 2 frases → mini conversación.</p><button class="btn secondary" onclick="markSpeaking()">Marcar speaking completado</button></div></div>`}
let mediaRecorder,chunks=[];
async function startRecording(){try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);chunks=[];mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{let blob=new Blob(chunks,{type:'audio/webm'});let url=URL.createObjectURL(blob);let audio=document.getElementById('audio');audio.src=url;audio.classList.remove('hidden');document.getElementById('recStatus').classList.remove('hidden');document.getElementById('recStatus').textContent='Grabación lista. Escúchate una vez y repite si quieres.'};mediaRecorder.start();document.getElementById('recStatus').classList.remove('hidden');document.getElementById('recStatus').textContent='Grabando...';}catch(e){alert('El navegador no permitió usar el micrófono. Revisa permisos.')}}
function stopRecording(){if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop()}
function markSpeaking(){state.speaking.push(new Date().toISOString());state.xp+=20;save();document.getElementById('recStatus').classList.remove('hidden');document.getElementById('recStatus').textContent='Speaking registrado. +20 XP.'}
function renderProgress(){document.getElementById('progress').innerHTML=`<div class="topline"><h2 class="title">Pasaporte y sellos</h2><span class="pill">🛂 ${state.xp} XP</span></div><div class="grid">${countries.map(c=>`<div class="card"><div class="stamp">${c.flag}</div><h3>${c.country}</h3><p>${c.stamp}</p><div class="seal">${pctUnit(c.id)>=80?'APPROVED':'PENDING'}</div><div class="bar"><span style="width:${pctUnit(c.id)}%"></span></div></div>`).join('')}</div><div class="lessonBox"><h3>Historial</h3><p>Respuestas: ${state.answers.length}</p><p>Speakings completados: ${state.speaking.length}</p><button class="btn danger" onclick="resetApp()">Reiniciar progreso</button></div>`}
function dailyCheck(){let today=new Date().toDateString(); if(state.lastStudy!==today){state.streak+=1;state.lastStudy=today;state.xp+=5;save();alert('Estudio marcado. +5 XP.')}else alert('Ya has marcado el estudio de hoy.')}
function resetApp(){if(confirm('¿Seguro que quieres borrar el progreso?')){localStorage.removeItem('passportEnglishState');location.reload()}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
renderMetrics();renderDashboard();
</script>
</body>
</html>
