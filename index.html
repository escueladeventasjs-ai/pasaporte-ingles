<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasaporte Inglés — Examen</title>
<style>
:root{--navy:#17213d;--navy2:#212749;--paper:#fffaf0;--cream:#f7f1e6;--line:#e7dfd1;--turq:#59d8d2;--gold:#d8b56d;--ok:#2f7d58;--bad:#9f3f3f;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,var(--navy),#0f172a);color:var(--navy)}button{font:inherit}.wrap{max-width:980px;margin:auto;padding:18px}.hero{background:var(--paper);border-radius:28px;padding:22px;box-shadow:0 22px 70px rgba(0,0,0,.25);margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:var(--navy2);color:var(--turq);display:grid;place-items:center;font-size:24px}h1{font-size:25px;margin:0;color:var(--navy2)}.sub{color:var(--muted);font-size:14px;margin-top:4px}.pill{background:#eef7f6;color:#155856;border:1px solid #c8ece9;padding:8px 12px;border-radius:999px;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.tab{border:0;border-radius:15px;padding:13px 10px;background:#ece4d7;color:#26304f;cursor:pointer}.tab.active{background:var(--navy2);color:white}.panel{background:rgba(255,250,240,.98);border-radius:24px;padding:22px;box-shadow:0 16px 45px rgba(0,0,0,.16);margin-bottom:16px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.unit{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;transition:.18s}.unit:hover{transform:translateY(-2px)}.unit h3{margin:4px 0 8px;color:var(--navy2)}.unit p{margin:0;color:#5d6678;line-height:1.45}.bar{height:9px;background:#ece4d7;border-radius:999px;overflow:hidden;margin-top:12px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--turq),var(--gold));width:0}.btn{border:0;background:var(--navy2);color:white;border-radius:14px;padding:12px 16px;cursor:pointer}.btn.secondary{background:#ece4d7;color:#26304f}.btn.ok{background:var(--ok)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}.question{font-size:23px;color:var(--navy2);margin:8px 0 16px;line-height:1.25}.option{width:100%;display:block;text-align:left;background:white;border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:14px 16px;cursor:pointer}.option:hover{border-color:var(--turq)}.correct{background:#eaf8ef!important;border-color:#98d7b0!important}.wrong{background:#fff0f0!important;border-color:#e8a0a0!important}.feedback{padding:14px 16px;border-radius:14px;background:#eef7f6;border:1px solid #c8ece9;color:#155856;margin-top:12px}.feedback.bad{background:#fff4ec;border-color:#f2cfaa;color:#7a4b1e}.tiny{font-size:13px;color:var(--muted)}.stamp{display:inline-grid;place-items:center;min-width:86px;min-height:86px;border:2px dashed var(--gold);border-radius:50%;background:#fff8e6;font-size:12px;font-weight:800;text-align:center;transform:rotate(-5deg);margin:8px}.speech{font-size:21px;color:var(--navy2);font-weight:700}.footer{text-align:center;color:#d9e4ff;font-size:12px;padding:18px}@media(max-width:760px){.wrap{padding:12px}.tabs{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero,.panel{border-radius:20px;padding:17px}.question{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="top">
      <div class="brand"><div class="logo">✈</div><div><h1>Pasaporte Inglés</h1><div class="sub">Estudia lo justo para aprobar el examen</div></div></div>
      <span class="pill" id="xpPill">0 XP</span>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="show('study',this)">1. Estudiar</button>
      <button class="tab" onclick="show('practice',this)">2. Practicar</button>
      <button class="tab" onclick="show('exam',this)">3. Examen</button>
      <button class="tab" onclick="show('progress',this)">4. Progreso</button>
    </div>
  </section>

  <section id="study" class="panel view"></section>
  <section id="practice" class="panel view hidden"></section>
  <section id="exam" class="panel view hidden"></section>
  <section id="progress" class="panel view hidden"></section>
  <div class="footer">Versión simplificada · funciona en móvil, tablet y ordenador</div>
</div>
<script>
const units=[
 {id:'u1',flag:'🇨🇦',name:'Unidad 1',title:'Communication for Social Workers',short:'Trabajo social, hobbies, countable/uncountable y present tenses',seal:'FIRST SOCIAL CONVERSATION',theory:['Social workers help people in schools, hospitals, prisons, clinics and communities.','Likes/dislikes: I like..., I love..., I enjoy..., I can’t stand...','Countable: book/books. Uncountable: advice, money, water, information.','Present simple = habits. Present continuous = now. Present perfect = experience/result now.']},
 {id:'u2',flag:'🇺🇸',name:'Unidad 2',title:'Migration',short:'Migración, gerunds/infinitives y past tenses',seal:'MIGRATION ROUTE',theory:['Immigration social workers support immigrants and refugees.','They help with housing, health, education and employment.','Enjoy, avoid, suggest + gerund: enjoy reading.','Want, decide, hope + to infinitive: want to learn.']},
 {id:'u3',flag:'🇸🇪',name:'Unidad 3',title:'Gender Equality',short:'Igualdad de género, do/make y modal verbs',seal:'EQUALITY CHECKPOINT',theory:['Gender equality means equal rights and opportunities.','Modal verbs: can, must, should, may.','After modal verbs, use the base verb: You should study.','Do homework. Make a decision.']},
 {id:'u4',flag:'🇯🇵',name:'Unidad 4',title:'Aging',short:'Envejecimiento, phrasal verbs y future tenses',seal:'FUTURE FLIGHT',theory:['Aging social work helps older adults live with dignity.','Phrasal verbs: look after, give up, get on.','Will = prediction/decision.','Be going to = plan. Present continuous = arranged future.']},
 {id:'u5',flag:'🇮🇸',name:'Unidad 5',title:'Mental Health',short:'Salud mental, comparatives/superlatives y relative clauses',seal:'MENTAL HEALTH PASS',theory:['Mental health is emotional and psychological wellbeing.','Comparative: easier than, more difficult than.','Superlative: the easiest, the most difficult.','Relative clauses: who for people, which for things.']},
 {id:'u6',flag:'🇦🇺',name:'Unidad 6',title:'Health Care',short:'Sanidad, compound nouns y conditionals',seal:'HEALTH CARE VISA',theory:['Health care social workers help people with health and wellness issues.','Compound nouns: health care, social worker, mental health.','Collective nouns name groups of people or things.','First conditional: If I study, I will pass.']}
];
const q=[
 {u:'u1',t:'vocab',q:'Social workers can be found...',o:['Only in hospitals','In every facet of community life','Only in schools'],a:1,e:'Pueden trabajar en muchos ámbitos: escuelas, hospitales, prisiones, comunidad, etc.'},
 {u:'u1',t:'vocab',q:'Child welfare social work focuses on...',o:['Protecting children from harm','Planning diets','Organising companies'],a:0,e:'Child welfare trata la protección de menores y familias vulnerables.'},
 {u:'u1',t:'grammar',q:'Complete: She ___ Spanish every day.',o:['speak','speaks','is speak'],a:1,e:'Present simple con she/he/it añade -s.'},
 {u:'u1',t:'grammar',q:'Which noun is uncountable?',o:['book','advice','student'],a:1,e:'Advice es incontable en inglés.'},
 {u:'u2',t:'vocab',q:'Immigration social workers help immigrants...',o:['make the transition to their new homes','avoid exams','become doctors'],a:0,e:'Ayudan en la transición a su nuevo hogar.'},
 {u:'u2',t:'grammar',q:'Complete: I enjoy ___ books.',o:['read','reading','to reading'],a:1,e:'Enjoy va seguido de gerundio.'},
 {u:'u2',t:'grammar',q:'Complete: She wants ___ English.',o:['learn','learning','to learn'],a:2,e:'Want va seguido de to + infinitive.'},
 {u:'u2',t:'grammar',q:'Complete: Yesterday, I ___ to class.',o:['go','went','gone'],a:1,e:'Past simple de go: went.'},
 {u:'u3',t:'vocab',q:'Gender equality means...',o:['Equal rights and opportunities','Only helping men','Only helping children'],a:0,e:'Igualdad de género = derechos y oportunidades.'},
 {u:'u3',t:'grammar',q:'Complete: You ___ respect other people.',o:['should','to should','shoulds'],a:0,e:'Después de un modal va el verbo base.'},
 {u:'u3',t:'grammar',q:'Choose the correct option.',o:['I make my homework','I do my homework','I doing homework'],a:1,e:'Homework suele ir con do.'},
 {u:'u4',t:'vocab',q:'Aging social work helps...',o:['older adults','only children','only students'],a:0,e:'Aging = envejecimiento/personas mayores.'},
 {u:'u4',t:'grammar',q:'Complete: I ___ visit my grandmother tomorrow.',o:['am going to','going','go to'],a:0,e:'Be going to expresa planes.'},
 {u:'u4',t:'grammar',q:'Complete: I think it ___ rain tomorrow.',o:['will','is','has'],a:0,e:'Will se usa para predicciones.'},
 {u:'u5',t:'vocab',q:'Mental health is related to...',o:['emotional wellbeing','traffic','furniture'],a:0,e:'Mental health se relaciona con bienestar emocional y psicológico.'},
 {u:'u5',t:'grammar',q:'Complete: This exercise is ___ than the first one.',o:['easy','easier','easiest'],a:1,e:'Comparativo: easier than.'},
 {u:'u5',t:'grammar',q:'Complete: The woman ___ works here is a social worker.',o:['which','who','where'],a:1,e:'Who se usa para personas.'},
 {u:'u6',t:'vocab',q:'Health care social workers help with...',o:['health and wellness issues','taxes','menus'],a:0,e:'Health care conecta salud, bienestar y apoyo social.'},
 {u:'u6',t:'grammar',q:'Complete: If I study, I ___ pass.',o:['will','would','was'],a:0,e:'First conditional: if + present, will + verb.'},
 {u:'u6',t:'grammar',q:'Which is a compound noun?',o:['health care','quickly','beautiful'],a:0,e:'Compound noun: dos palabras que forman un concepto.'}
];
const speak=['My name is Ana.','I like helping people.','I am studying English.','I enjoy reading and watching films.','If I study every day, I will pass the exam.'];
let s=JSON.parse(localStorage.getItem('pi_simple')||'{"xp":0,"answers":[],"speak":0,"last":""}');let current=[],idx=0,score=0,mode='practice';
function save(){localStorage.setItem('pi_simple',JSON.stringify(s));document.getElementById('xpPill').textContent=s.xp+' XP'}
function show(id,b){document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');if(id==='study')renderStudy();if(id==='practice')renderPractice();if(id==='exam')renderExam();if(id==='progress')renderProgress()}
function unitPct(id){let total=q.filter(x=>x.u===id).length;let ok=s.answers.filter(x=>x.u===id&&x.ok).length;return Math.min(100,Math.round(ok/Math.max(1,total)*100))}
function renderStudy(){document.getElementById('study').innerHTML='<div class="top"><div><h2>1. Elige unidad y estudia</h2><p class="tiny">Primero lee el resumen. Luego practica 5 preguntas.</p></div><button class="btn secondary" onclick="markToday()">Marcar estudio de hoy</button></div><div class="grid">'+units.map(u=>`<div class="unit" onclick="openUnit('${u.id}')"><div style="font-size:30px">${u.flag}</div><h3>${u.name}</h3><p><strong>${u.title}</strong></p><p>${u.short}</p><div class="bar"><span style="width:${unitPct(u.id)}%"></span></div><p class="tiny">${unitPct(u.id)}% completado</p></div>`).join('')+'</div><div id="unitBox"></div>'}
function openUnit(id){let u=units.find(x=>x.id===id);document.getElementById('unitBox').innerHTML=`<div class="card"><h2>${u.flag} ${u.name} — ${u.title}</h2>${u.theory.map(x=>`<p>• ${x}</p>`).join('')}<div class="row"><button class="btn" onclick="startUnit('${id}')">Practicar esta unidad</button><button class="btn secondary" onclick="startRescue('${id}')">Ruta Rescue</button></div></div>`;document.getElementById('unitBox').scrollIntoView({behavior:'smooth'})}
function renderPractice(){let weak=units.slice().sort((a,b)=>unitPct(a.id)-unitPct(b.id))[0];document.getElementById('practice').innerHTML=`<h2>2. Practicar</h2><p>Recomendación de hoy: <strong>${weak.name} — ${weak.title}</strong></p><div class="row"><button class="btn" onclick="startUnit('${weak.id}')">Practicar recomendada</button><button class="btn secondary" onclick="startAll(8)">Mezclar preguntas</button><button class="btn secondary" onclick="renderSpeaking()">Speaking corto</button></div><div id="practiceBox"></div>`}
function renderSpeaking(){let text=speak[Math.floor(Math.random()*speak.length)];document.getElementById('practiceBox').innerHTML=`<div class="card"><h3>Speaking corto</h3><p class="speech">${text}</p><p class="tiny">Léelo en voz alta 3 veces. No hace falta grabar si no quiere.</p><button class="btn ok" onclick="s.speak++;s.xp+=10;save();renderSpeaking()">Hecho · +10 XP</button></div>`}
function startUnit(id){mode='practice';current=shuffle(q.filter(x=>x.u===id)).slice(0,5);idx=0;score=0;renderQ('practiceBox')}
function startRescue(id){mode='practice';current=shuffle(q.filter(x=>x.u===id&&x.t==='grammar'));if(current.length<3)current=shuffle(q.filter(x=>x.u===id));current=current.slice(0,3);idx=0;score=0;document.getElementById('practiceBox').innerHTML='<div class="feedback bad"><strong>Ruta Rescue:</strong> solo 3 preguntas, sin presión.</div>';setTimeout(()=>renderQ('practiceBox'),500)}
function startAll(n){mode='practice';current=shuffle(q).slice(0,n);idx=0;score=0;renderQ('practiceBox')}
function renderQ(target){let item=current[idx];if(!item){document.getElementById(target).innerHTML=`<div class="feedback"><h3>Práctica terminada</h3><p>Resultado: ${score}/${current.length}</p><button class="btn" onclick="renderPractice()">Seguir practicando</button></div>`;save();return}document.getElementById(target).innerHTML=`<div class="card"><div class="tiny">Pregunta ${idx+1}/${current.length}</div><div class="question">${item.q}</div>${item.o.map((op,i)=>`<button class="option" onclick="ans(${i},'${target}')">${op}</button>`).join('')}<div id="fb"></div></div>`}
function ans(i,target){let item=current[idx],ok=i===item.a;if(ok){score++;s.xp+=10}else{s.xp+=2}s.answers.push({u:item.u,t:item.t,ok:ok,d:new Date().toISOString()});document.querySelectorAll('.option')[i].classList.add(ok?'correct':'wrong');document.querySelectorAll('.option')[item.a].classList.add('correct');document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'Bien.':'Casi.'}</strong> ${item.e}</div><br><button class="btn" onclick="idx++;renderQ('${target}')">Continuar</button>`;save()}
function renderExam(){document.getElementById('exam').innerHTML=`<h2>3. Simulación de examen</h2><p>Hazlo cuando ya hayas practicado. Mezcla preguntas de todas las unidades.</p><div class="row"><button class="btn" onclick="startExam(10)">Examen corto</button><button class="btn secondary" onclick="startExam(20)">Examen completo</button></div><div id="examBox"></div>`}
function startExam(n){mode='exam';current=shuffle(q).slice(0,n);idx=0;score=0;renderQExam()}
function renderQExam(){let item=current[idx];if(!item){let pct=Math.round(score/current.length*100);document.getElementById('examBox').innerHTML=`<div class="card"><h2>Resultado: ${pct}%</h2><p>${pct>=70?'Estás en zona de aprobado.':'Hay que reforzar antes de repetir.'}</p><button class="btn" onclick="renderExam()">Repetir examen</button></div>`;save();return}document.getElementById('examBox').innerHTML=`<div class="card"><div class="tiny">Examen · ${idx+1}/${current.length}</div><div class="question">${item.q}</div>${item.o.map((op,i)=>`<button class="option" onclick="ansExam(${i})">${op}</button>`).join('')}</div>`}
function ansExam(i){let item=current[idx],ok=i===item.a;if(ok){score++;s.xp+=15}else{s.xp+=1}s.answers.push({u:item.u,t:item.t,ok:ok,d:new Date().toISOString()});idx++;save();renderQExam()}
function renderProgress(){let total=s.answers.length,ok=s.answers.filter(x=>x.ok).length;let pct=total?Math.round(ok/total*100):0;document.getElementById('progress').innerHTML=`<h2>4. Progreso</h2><div class="grid"><div class="card"><h3>Resultado global</h3><p class="question">${pct}%</p><p>${ok}/${total} respuestas correctas</p></div><div class="card"><h3>Speaking</h3><p class="question">${s.speak}</p><p>prácticas completadas</p></div></div><div class="grid">${units.map(u=>`<div class="card"><h3>${u.flag} ${u.name}</h3><p>${u.seal}</p><div class="stamp">${unitPct(u.id)>=80?'APROBADO':'PENDIENTE'}</div><div class="bar"><span style="width:${unitPct(u.id)}%"></span></div><p class="tiny">${unitPct(u.id)}%</p></div>`).join('')}</div><div class="card"><button class="btn secondary" onclick="reset()">Reiniciar progreso</button></div>`}
function markToday(){let today=new Date().toDateString();if(s.last!==today){s.last=today;s.xp+=5;save();alert('Estudio marcado. +5 XP')}else alert('Ya está marcado hoy.')}
function reset(){if(confirm('¿Borrar progreso?')){localStorage.removeItem('pi_simple');location.reload()}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}save();renderStudy();
</script>
</body>
</html>
